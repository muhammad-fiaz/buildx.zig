name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test

  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - basic-executable
          - library-with-tests
          - cross-compile
          - custom-options
          - run-with-args
          - system-lib
          - monorepo
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build
        working-directory: examples/${{ matrix.example }}
